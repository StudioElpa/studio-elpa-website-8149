<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" href="/assets/favicon.png" />
		<title>Studio Elpa · Custom Window Treatments · South Florida</title>
		<meta
			name="description"
			content="Custom drapery, shades, and motorized window treatments, made to measure in European fabrics and fitted to how you live. One team from consultation to install, with electrical handled by our licensed, insured partner. Serving South Florida."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Studio Elpa" />
		<meta property="og:title" content="Studio Elpa · Custom Window Treatments · South Florida" />
		<meta
			property="og:description"
			content="Custom drapery, shades, and motorized window treatments, made to measure in European fabrics and fitted to how you live. Serving South Florida."
		/>
		<meta property="og:image" content="/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="A sunlit room with custom drapery, above the Studio Elpa logo."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<!-- The homepage hero is the LCP element. Pages are prerendered now, but
		     the preload still wins the request a round trip earlier. imagesrcset
		     mirrors the <img> exactly, so a phone preloads the 780px file rather
		     than the 1800px one. -->
		<link
			rel="preload"
			as="image"
			href="/assets/hero-1120.jpg"
			imagesrcset="/assets/hero-780.jpg 780w, /assets/hero-1120.jpg 1120w, /assets/hero.jpg 1800w"
			imagesizes="(max-width: 860px) 100vw, 1000px"
			fetchpriority="high"
		/>
		<!-- Fonts are self-hosted from /fonts, so there is no third-party font
		     request and no preconnect to warm. Only the Newsreader roman file is
		     preloaded: it is the one the hero headline needs. The italic and the
		     sans are fetched by the stylesheet on their own schedule, and every
		     face declares font-display: swap so text is visible throughout. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/newsreader-var-latin.woff2"
			crossorigin
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
